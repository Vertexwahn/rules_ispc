name: Bazel

on:
   pull_request: {}
   push: {}

jobs:
  build_and_test_macos26:
    name: macOS 26 Bazel build <Apple Clang21>
    runs-on: macOS-26

    steps:
      - uses: actions/checkout@v7

      - name: Mount bazel cache
        uses: actions/cache@v6
        with:
          path: "/home/runner/.cache/bazel"
          key: bazel

      - name: Print info
        run: |
          echo "OS info:"
          sw_vers
          uname
          echo "Compiler info:"
          clang --version

      - name: Ispc
        run: |
          brew install ispc
          ispc --version
          ispc --support-matrix

      - name: Build
        run: |
          cd tests
          bazel build --config=macos //...

      - name: Run
        run: |
          cd tests
          bazel run --config=macos //square:main

  build_and_test_ubuntu26:
    name: Linux Ubuntu 26.04 build <GCC 15>
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Mount bazel cache
      uses: actions/cache@v6
      with:
        path: "/home/runner/.cache/bazel"
        key: bazel-ubuntu26

    - name: Build
      run: |
        cd tests
        bazel build --config=gcc15 //...

    - name: Run
      run: |
        cd tests
        bazel run --config=gcc15 //square:main

  build_and_test_windows_server2025:
    name: Windows Server 2025 build <Visual Studio 2022>
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v7

    - name: Mount bazel cache
      uses: actions/cache@v6
      with:
        path: "/home/runner/.cache/bazel"
        key: bazel

    - name: Build
      run: |
        cd tests
        bazel build --config=vs2026 //...

    - name: Run
      run: |
        cd tests
        bazel run --config=vs2026 //square:main
